services:
  api:
    container_name: archive-api-dev
    image: ${DOCKER_REGISTRY-}mvmscorearchiveapi
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - 5001:5001
    environment:
      - ASPNETCORE_ENVIRONMENT=dev
      - ASPNETCORE_HTTP_PORTS=5001
    # depends_on:
    #   database:
    #     condition: service_healthy
    volumes:
      - app_data:/app/data
    networks:
      - archive-network-dev
      
  database:
    image: postgres:latest
    container_name: postgres-dev
    # restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - /home/data/dev/pgdata_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - archive-network-dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]

  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - 8080:8080
    networks:
      - archive-network-dev

  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: stirling
    ports:
      - '8000:8080'
    volumes:
      - /home/data/dev/StirlingPDF/trainingData:/usr/share/tessdata # Required for extra OCR languages
      - /home/data/dev/StirlingPDF/extraConfigs:/configs
      - /home/data/dev/StirlingPDF/customFiles:/customFiles/
      - /home/data/dev/StirlingPDF/logs:/logs/
      - /home/data/dev/StirlingPDF/pipeline:/pipeline/
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - INSTALL_BOOK_AND_ADVANCED_HTML_OPS=false
      - LANGS=en_GB
    networks:
      - archive-network-dev

networks:
  archive-network-dev:
    driver: bridge

volumes:
  app_data:
